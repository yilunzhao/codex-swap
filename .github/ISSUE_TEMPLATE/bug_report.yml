name: Bug report
description: Something did not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste the contents of `auth.json`
        or an `export` bundle — both contain live OAuth tokens.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ codex-swap switch
        ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `codex-swap doctor`
      description: This reports no credentials, only paths, counts and problems.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: codex-swap version
      placeholder: "0.1.0 (from `codex-swap --version`)"
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      placeholder: "0.147.0 (from `codex --version`)"
    validations:
      required: true
