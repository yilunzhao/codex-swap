[project]
name = "codex-swap"
version = "0.1.0"
description = "Multi-account switcher for the Codex CLI"
readme = "README.md"
requires-python = ">=3.10"
# Deliberately empty. Codex keeps its credentials in a plain JSON file on every
# platform, so there is no keyring, no HTTP client and no TOML parser to pull
# in — which means `pipx install codex-swap` can never break because a
# transitive dependency did.
dependencies = []
authors = [{ name = "Yilun Zhao", email = "yilun.zhao@yale.edu" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "codex-cli", "openai", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/yilunzhao/codex-swap"
Repository = "https://github.com/yilunzhao/codex-swap"
Issues = "https://github.com/yilunzhao/codex-swap/issues"
Changelog = "https://github.com/yilunzhao/codex-swap/blob/main/CHANGELOG.md"

[project.scripts]
codex-swap = "codex_swap.cli:main"
xswap = "codex_swap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_swap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "posix_only: skipped on Windows, where the behaviour has no equivalent",
]

[tool.coverage.run]
branch = true
source = ["codex_swap"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The store deliberately mirrors Codex's own camelCase JSON keys.
    "N815",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
